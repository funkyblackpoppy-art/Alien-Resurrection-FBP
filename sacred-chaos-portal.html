<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sacred Chaos App Portal — Funky Black Poppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080810;
    --purple: #8b5cf6;
    --teal: #06b6d4;
    --gold: #f59e0b;
    --pink: #ec4899;
    --gray: #6b7280;
    --red-muted: #9f1239;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --drawer-bg: #0d0d1a;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ── CANVAS STARFIELD ── */
  #starCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── PASSWORD GATE ── */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    flex-direction: column;
    gap: 2rem;
    padding: 2rem;
    transition: opacity 0.6s ease;
  }
  #gate.fade-out { opacity: 0; pointer-events: none; }

  .gate-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .gate-logo {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--purple), var(--pink), var(--teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    line-height: 1.2;
    position: relative;
    z-index: 1;
  }

  .gate-sub {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.7rem, 2vw, 0.9rem);
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-align: center;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    margin-top: -1.5rem;
  }

  .gate-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
    max-width: 360px;
    position: relative;
    z-index: 1;
  }

  .gate-form input {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 0.85rem 1.2rem;
    outline: none;
    text-align: center;
    letter-spacing: 0.1em;
    transition: border-color 0.3s;
    width: 100%;
  }
  .gate-form input:focus { border-color: var(--purple); }
  .gate-form input::placeholder { color: var(--text-dim); letter-spacing: 0.05em; }

  .gate-error {
    color: var(--pink);
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2rem;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 0.85rem 1.5rem;
    transition: opacity 0.2s, transform 0.2s;
    width: 100%;
  }
  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  /* ── MAIN APP ── */
  #app {
    display: none;
    min-height: 100vh;
    position: relative;
    z-index: 1;
    padding-bottom: 80px; /* space for mobile nav */
  }
  #app.visible { display: block; }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(8,8,16,0.7);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .header-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    background: linear-gradient(135deg, var(--purple), var(--teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .app-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }
  .app-count span {
    color: var(--purple);
    font-weight: 600;
  }

  .btn-admin {
    background: rgba(139,92,246,0.15);
    border: 1px solid rgba(139,92,246,0.4);
    border-radius: 8px;
    color: var(--purple);
    cursor: pointer;
    font-size: 0.8rem;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 0.45rem 0.9rem;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .btn-admin:hover { background: rgba(139,92,246,0.28); color: #fff; }
  .btn-admin.active { background: var(--purple); color: #fff; }

  /* ── CONTROLS ── */
  .controls {
    padding: 1.5rem 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .search-wrap {
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 1rem;
    pointer-events: none;
  }
  #searchInput {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    padding: 0.75rem 1rem 0.75rem 2.6rem;
    transition: border-color 0.3s;
    width: 100%;
  }
  #searchInput:focus { border-color: var(--purple); }
  #searchInput::placeholder { color: var(--text-dim); }

  .filter-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 0.4rem 0.85rem;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--purple); color: var(--text); }
  .filter-btn.active { background: rgba(139,92,246,0.2); border-color: var(--purple); color: var(--purple); }

  /* ── CARD GRID ── */
  .grid-section {
    padding: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
  }

  /* Card entrance animation */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    animation: cardIn 0.5s ease both;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(6,182,212,0.04));
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(139,92,246,0.4);
    box-shadow: 0 12px 40px rgba(139,92,246,0.2), 0 0 0 1px rgba(139,92,246,0.1);
  }
  .card:hover::before { opacity: 1; }

  /* stagger delay for entrance */
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.2s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.3s; }
  .card:nth-child(7) { animation-delay: 0.35s; }
  .card:nth-child(8) { animation-delay: 0.4s; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .card-icon {
    font-size: 2.2rem;
    line-height: 1;
    flex-shrink: 0;
  }

  .card-badges {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.4rem;
  }

  .badge {
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 0.25rem 0.6rem;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-personal  { background: rgba(107,114,128,0.25); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }
  .badge-shareable { background: rgba(6,182,212,0.15);   color: var(--teal); border: 1px solid rgba(6,182,212,0.4); }
  .badge-forsale   { background: rgba(245,158,11,0.15);  color: var(--gold); border: 1px solid rgba(245,158,11,0.4); }
  .badge-archived  { background: rgba(159,18,57,0.2);    color: #f43f5e;     border: 1px solid rgba(159,18,57,0.4); }

  .cat-tag {
    background: rgba(236,72,153,0.1);
    border: 1px solid rgba(236,72,153,0.25);
    border-radius: 5px;
    color: var(--pink);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 0.2rem 0.5rem;
    text-transform: uppercase;
  }

  .card-name {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    line-height: 1.3;
  }

  .card-desc {
    color: var(--text-dim);
    font-size: 0.85rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: auto;
    padding-top: 0.5rem;
    flex-wrap: wrap;
  }

  .btn-launch {
    background: linear-gradient(135deg, var(--purple), var(--teal));
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.5rem 1rem;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.15s;
    display: inline-block;
  }
  .btn-launch:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-buy {
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.5);
    border-radius: 8px;
    color: var(--gold);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.5rem 1rem;
    text-decoration: none;
    transition: background 0.2s;
    display: inline-block;
  }
  .btn-buy:hover { background: rgba(245,158,11,0.28); }

  .card-price {
    font-size: 0.82rem;
    color: var(--gold);
    font-weight: 600;
    margin-left: auto;
  }

  /* ── NO RESULTS ── */
  .no-results {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-size: 0.95rem;
    display: none;
  }
  .no-results.visible { display: block; }
  .no-results .emoji { font-size: 3rem; margin-bottom: 1rem; }

  /* ── ADMIN DRAWER ── */
  #drawerOverlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #drawerOverlay.open { opacity: 1; pointer-events: all; }

  #adminDrawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 201;
    width: min(420px, 100vw);
    background: var(--drawer-bg);
    border-left: 1px solid rgba(139,92,246,0.25);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
  }
  #adminDrawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--drawer-bg);
    z-index: 1;
  }
  .drawer-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 600;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .btn-close {
    background: rgba(255,255,255,0.06);
    border: none;
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0.4rem 0.65rem;
    transition: background 0.2s, color 0.2s;
  }
  .btn-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  .drawer-body {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    flex: 1;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .form-group label {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.07em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    outline: none;
    padding: 0.7rem 1rem;
    transition: border-color 0.2s;
    width: 100%;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--purple); }
  .form-group select { cursor: pointer; appearance: none; }
  .form-group select option { background: #1a1a2e; color: var(--text); }
  .form-group textarea { resize: vertical; min-height: 80px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }

  .drawer-actions {
    padding: 1.25rem 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    position: sticky;
    bottom: 0;
    background: var(--drawer-bg);
  }

  .btn-save {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.8rem;
    transition: opacity 0.2s, transform 0.15s;
    width: 100%;
  }
  .btn-save:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-export {
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.35);
    border-radius: 10px;
    color: var(--teal);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 0.7rem;
    text-align: center;
    transition: background 0.2s;
    width: 100%;
  }
  .btn-export:hover { background: rgba(6,182,212,0.2); }

  .form-success {
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.3);
    border-radius: 10px;
    color: var(--teal);
    display: none;
    font-size: 0.85rem;
    padding: 0.75rem 1rem;
    text-align: center;
  }
  .form-success.visible { display: block; }

  /* ── MOBILE BOTTOM NAV ── */
  #bottomNav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 99;
    display: none;
    align-items: center;
    justify-content: space-around;
    background: rgba(8,8,16,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 0.6rem 0;
    padding-bottom: calc(0.6rem + env(safe-area-inset-bottom));
  }

  .nav-item {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 0.3rem 1.2rem;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-item .nav-icon { font-size: 1.3rem; }
  .nav-item.active { color: var(--purple); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 2rem 1rem 1rem;
    color: var(--text-dim);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
  footer a { color: var(--purple); text-decoration: none; }
  footer .heart { color: var(--pink); }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    #bottomNav { display: flex; }
    .btn-admin { display: none; }
    .grid { grid-template-columns: 1fr; }
    .controls { padding: 1rem 1rem 0; }
    .grid-section { padding: 1rem; }
  }

  @media (min-width: 641px) {
    #bottomNav { display: none !important; }
  }

  /* ── SCROLL ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 3px; }

  /* animated gradient text for section heading */
  @keyframes gradShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .section-heading {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--purple), var(--pink), var(--teal), var(--gold));
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradShift 6s ease infinite;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-glow"></div>
  <div class="gate-logo">Sacred Chaos<br>App Portal</div>
  <div class="gate-sub">Funky Black Poppy ✦ Rachael Nike</div>
  <div class="gate-form">
    <input type="password" id="pwInput" placeholder="Enter portal password" autocomplete="current-password">
    <div class="gate-error" id="gateError">&nbsp;</div>
    <button class="btn-primary" onclick="checkPassword()">Enter the Portal</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="header-title">✦ Sacred Chaos Portal</div>
    <div class="header-right">
      <div class="app-count">Apps: <span id="appCountDisplay">0</span></div>
      <button class="btn-admin" id="adminToggle" onclick="toggleAdmin()">⚙ Admin</button>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search apps by name, description, or category…">
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" data-filter="personal"  onclick="setFilter('personal', this)">Personal</button>
      <button class="filter-btn" data-filter="shareable" onclick="setFilter('shareable', this)">Shareable</button>
      <button class="filter-btn" data-filter="forsale"   onclick="setFilter('forsale', this)">For Sale</button>
      <button class="filter-btn" data-filter="archived"  onclick="setFilter('archived', this)">Archived</button>
    </div>
  </div>

  <div class="grid-section">

<script>
// ── STARFIELD ──────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function initStars(count) {
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + 0.2,
        alpha: Math.random() * 0.7 + 0.15,
        speed: Math.random() * 0.003 + 0.001,
        phase: Math.random() * Math.PI * 2,
        color: ['#ffffff','#c4b5fd','#67e8f9','#fcd34d'][Math.floor(Math.random()*4)]
      });
    }
  }

  let raf;
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      const a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.speed * 1000 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = a;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(draw);
  }

  resize();
  initStars(220);
  raf = requestAnimationFrame(draw);
  window.addEventListener('resize', () => { resize(); initStars(220); });
})();

// ── PASSWORD GATE ──────────────────────────────────────────
const PASSWORD = 'sacredchaos2025';

function checkPassword() {
  const val = document.getElementById('pwInput').value.trim();
  if (val === PASSWORD) {
    document.getElementById('gateError').textContent = '';
    document.getElementById('gate').classList.add('fade-out');
    setTimeout(() => {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').classList.add('visible');
    }, 600);
  } else {
    const err = document.getElementById('gateError');
    err.textContent = 'Incorrect password. Try again.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});

// ── APP DATA ───────────────────────────────────────────────
// Edit this array directly to pre-populate your apps.
const SEED_APPS = [
  {
    id: 'seed-1',
    name: 'Sacred Tarot Generator',
    url: '#',
    description: 'Draw daily tarot cards with sacred symbolism and personalized interpretations powered by cosmic energy.',
    status: 'forsale',
    category: 'Spiritual',
    emoji: '🔮',
    price: '$12'
  },
  {
    id: 'seed-2',
    name: 'FBP Color Palette Creator',
    url: '#',
    description: 'Generate beautiful, soul-aligned color palettes inspired by nature, mood, and the sacred divine.',
    status: 'shareable',
    category: 'Art Tools',
    emoji: '🎨',
    price: ''
  },
  {
    id: 'seed-3',
    name: 'Moon Phase Journal',
    url: '#',
    description: 'Track your intentions, reflections, and growth through the sacred cycles of the lunar calendar.',
    status: 'personal',
    category: 'Spiritual',
    emoji: '🌙',
    price: ''
  },
  {
    id: 'seed-4',
    name: 'Turtle Oracle Daily Reading',
    url: '#',
    description: 'Receive daily wisdom and guidance from the ancient turtle oracle — slow, steady, and infinitely wise.',
    status: 'forsale',
    category: 'Spiritual',
    emoji: '🐢',
    price: '$8'
  },
  {
    id: 'seed-5',
    name: 'Inventory Tracker Pro',
    url: '#',
    description: 'Manage your product inventory, stock levels, and sales data in one clean, simple dashboard.',
    status: 'personal',
    category: 'Business',
    emoji: '📦',
    price: ''
  },
  {
    id: 'seed-6',
    name: 'Sacred Geometry Generator',
    url: '#',
    description: 'Create stunning sacred geometry art — mandalas, flower of life, metatron\'s cube, and beyond.',
    status: 'forsale',
    category: 'Art Tools',
    emoji: '✨',
    price: '$15'
  }
];

// ── STATE ──────────────────────────────────────────────────
let allApps = [];
let activeFilter = 'all';
let searchQuery = '';

function loadApps() {
  const stored = localStorage.getItem('sacredChaosApps');
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      // Merge seed apps + user-added apps (avoid dupes by id)
      const storedIds = new Set(parsed.map(a => a.id));
      const extras = parsed.filter(a => !SEED_APPS.find(s => s.id === a.id));
      allApps = [...SEED_APPS, ...extras];
    } catch(e) {
      allApps = [...SEED_APPS];
    }
  } else {
    allApps = [...SEED_APPS];
  }
}

function saveApps() {
  // Save the non-seed apps (user additions) + full list
  localStorage.setItem('sacredChaosApps', JSON.stringify(allApps));
}

// ── BADGE HELPERS ──────────────────────────────────────────
const BADGE_META = {
  personal:  { label: 'Personal',  cls: 'badge-personal' },
  shareable: { label: 'Shareable', cls: 'badge-shareable' },
  forsale:   { label: 'For Sale',  cls: 'badge-forsale' },
  archived:  { label: 'Archived',  cls: 'badge-archived' }
};

function badgeHTML(status) {
  const m = BADGE_META[status] || BADGE_META['personal'];
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

// ── CARD RENDERING ─────────────────────────────────────────
function renderCards() {
  const grid = document.getElementById('cardGrid');
  const noRes = document.getElementById('noResults');
  const q = searchQuery.toLowerCase();

  const filtered = allApps.filter(app => {
    const matchFilter = activeFilter === 'all' || app.status === activeFilter;
    const matchSearch = !q ||
      app.name.toLowerCase().includes(q) ||
      (app.description || '').toLowerCase().includes(q) ||
      (app.category || '').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  document.getElementById('appCountDisplay').textContent = allApps.length;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noRes.classList.add('visible');
    return;
  }
  noRes.classList.remove('visible');

  grid.innerHTML = filtered.map((app, i) => {
    const delayStyle = `animation-delay: ${Math.min(i * 0.05, 0.4)}s`;
    const launchBtn = app.url && app.url !== '#'
      ? `<a class="btn-launch" href="${escHtml(app.url)}" target="_blank" rel="noopener">Launch ↗</a>`
      : `<span class="btn-launch" style="opacity:0.5;cursor:default;">Launch ↗</span>`;
    const buyBtn = (app.status === 'forsale' && app.price)
      ? `<a class="btn-buy" href="${escHtml(app.url || '#')}" target="_blank" rel="noopener">Buy ${escHtml(app.price)}</a>`
      : '';
    const priceTag = (app.price && app.status !== 'forsale')
      ? `<span class="card-price">${escHtml(app.price)}</span>`
      : '';

    return `
      <div class="card" style="${delayStyle}">
        <div class="card-top">
          <div class="card-icon">${app.emoji || '📱'}</div>
          <div class="card-badges">
            ${badgeHTML(app.status)}
            <span class="cat-tag">${escHtml(app.category || '')}</span>
          </div>
        </div>
        <div class="card-name">${escHtml(app.name)}</div>
        <div class="card-desc">${escHtml(app.description || '')}</div>
        <div class="card-footer">
          ${launchBtn}
          ${buyBtn}
          ${priceTag}
        </div>
      </div>
    `;
  }).join('');
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ── SEARCH & FILTER ────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value;
  renderCards();
});

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

// ── ADMIN DRAWER ───────────────────────────────────────────
let adminOpen = false;

function toggleAdmin() {
  adminOpen = !adminOpen;
  document.getElementById('adminDrawer').classList.toggle('open', adminOpen);
  document.getElementById('drawerOverlay').classList.toggle('open', adminOpen);
  const btn = document.getElementById('adminToggle');
  if (btn) btn.classList.toggle('active', adminOpen);
  // mobile nav
  const navAdmin = document.getElementById('navAdmin');
  if (navAdmin) navAdmin.classList.toggle('active', adminOpen);
  if (adminOpen) {
    document.getElementById('navHome').classList.remove('active');
    document.getElementById('navSearch').classList.remove('active');
  }
}

function addApp() {
  const name = document.getElementById('fName').value.trim();
  const url  = document.getElementById('fUrl').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const status   = document.getElementById('fStatus').value;
  const category = document.getElementById('fCategory').value;
  const emoji = document.getElementById('fEmoji').value.trim() || '📱';
  const price = document.getElementById('fPrice').value.trim();

  if (!name) { alert('Please enter an app name.'); return; }

  const newApp = {
    id: 'user-' + Date.now(),
    name, url, description: desc, status, category, emoji, price
  };
  allApps.push(newApp);
  saveApps();
  renderCards();

  // reset form
  ['fName','fUrl','fDesc','fEmoji','fPrice'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fStatus').value = 'personal';
  document.getElementById('fCategory').value = 'Art Tools';

  const suc = document.getElementById('formSuccess');
  suc.classList.add('visible');
  setTimeout(() => suc.classList.remove('visible'), 3000);
}

function exportApps() {
  const json = JSON.stringify(allApps, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sacred-chaos-apps.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── MOBILE NAV ─────────────────────────────────────────────
function navTo(section) {
  ['navHome','navSearch','navAdmin'].forEach(id => document.getElementById(id).classList.remove('active'));

  if (section === 'home') {
    document.getElementById('navHome').classList.add('active');
    if (adminOpen) toggleAdmin();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (section === 'search') {
    document.getElementById('navSearch').classList.add('active');
    if (adminOpen) toggleAdmin();
    document.getElementById('searchInput').focus();
    document.querySelector('.controls').scrollIntoView({ behavior: 'smooth' });
  } else if (section === 'admin') {
    document.getElementById('navAdmin').classList.add('active');
    if (!adminOpen) toggleAdmin();
  }
}

// ── INIT ───────────────────────────────────────────────────
loadApps();
renderCards();
</script>
